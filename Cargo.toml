[package]
name = "arc-registry"
version = "0.1.0"
edition = "2021"
description = "Typed models and a CLI for the arc_registry — projects, handshakes, and ecosystem partners."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "arc-registry"
path = "src/main.rs"
